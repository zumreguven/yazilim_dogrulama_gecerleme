version: "3.9"


services:
  db:
    image: postgres:15
    container_name: career-management-db
    environment:
      POSTGRES_DB: career_management
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - mynet

  app:
    build: .
    container_name: career-app
    depends_on:
      - db
    ports:
      - "8082:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/career_management
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    networks:
      - mynet

  selenium:
    image: seleniarm/standalone-chromium:latest
    ports:
      - "4444:4444"
    networks:
      - mynet

  jenkins:
    build:
      context: ./docker
      dockerfile: Jenkinsfile.docker
    user: root
    ports:
      - "8081:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - jenkins_home:/var/jenkins_home
    networks:
      - mynet

networks:
  mynet:
volumes:
  db-data:
  jenkins_home: