
version: "3.9"


services:
  db:
    image: postgres:15
    container_name: career-management-db
    environment:
      POSTGRES_DB: career_management
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - mynet

  app:
    build: .
    container_name: career-app
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/career_management
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 1234
    networks:
      - mynet

  selenium-hub:
    image: selenium/hub:4.18.1
    ports:
      - "4444:4444"
    networks:
      - mynet

  chrome:
    image: selenium/node-chrome:4.18.1
    depends_on:
      - selenium-hub
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
    networks:
      - mynet

  jenkins:
    image: jenkins/jenkins:lts
    user: root
    ports:
      - "8081:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - jenkins_home:/var/jenkins_home
    networks:
      - mynet

networks:
  mynet:
volumes:
  db-data:
  jenkins_home: