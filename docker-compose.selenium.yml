
version: '3.8'
services:
  selenium-hub:
    image: selenium/hub:4.11.0
    platform: linux/amd64
    ports:
      - "4444:4444"
    healthcheck:
      test: ["CMD-SHELL", "curl -sSf http://localhost:4444/status | grep -q '"ready":true' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12

  chrome:
    image: selenium/node-chrome:4.11.0
    platform: linux/amd64
    shm_size: 2gb
    depends_on:
      - selenium-hub
    environment:
      SE_EVENT_BUS_HOST: selenium-hub
      SE_EVENT_BUS_PUBLISH_PORT: 4442
      SE_EVENT_BUS_SUBSCRIBE_PORT: 4443
      SE_NODE_MAX_SESSIONS: 4
    volumes:
      - /dev/shm:/dev/shm
