version: "3.8"

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: career_management
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    # Do not bind to host port so we avoid local port conflicts in dev/CI agents
    # If you need to access Postgres from host, use the separate `docker-compose.yml` instead.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d career_management"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: ci
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/career_management
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: update

      # Selenium testlerin RemoteWebDriver ile bağlanması için
      SELENIUM_REMOTE_URL: http://selenium-hub:4444/wd/hub
    depends_on:
      postgres:
        condition: service_healthy
      selenium-hub:
        condition: service_started
    # Not published to host for CI-run; tests run inside compose network and access via http://app:8080

  maven:
    image: maven:3.9.9-eclipse-temurin-17
    volumes:
      - ./:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
    working_dir: /workspace
    environment:
      DB_HOST: postgres
      DB_USER: postgres
      DB_PASSWORD: postgres
      SELENIUM_REMOTE_URL: http://selenium-hub:4444/wd/hub
      APP_BASE_URL: http://app:8080
      DOCKER_HOST: unix:///var/run/docker.sock
    depends_on:
      - app
    # Keep the container running idle so `docker compose up` doesn't execute `mvn` with no goals
    command: tail -f /dev/null
    # This service is used to run Maven commands inside the compose network so tests can reach other services.

  selenium-hub:
    image: selenium/hub:4.11.0
    platform: linux/amd64
    healthcheck:
      test: ["CMD-SHELL", "curl -sSf http://localhost:4444/status | grep -q '\"ready\":true' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12

  chrome:
    image: selenium/node-chrome:4.11.0
    platform: linux/amd64
    shm_size: 2gb
    depends_on:
      - selenium-hub
    environment:
      SE_EVENT_BUS_HOST: selenium-hub
      SE_EVENT_BUS_PUBLISH_PORT: 4442
      SE_EVENT_BUS_SUBSCRIBE_PORT: 4443
      SE_NODE_MAX_SESSIONS: 4
    volumes:
      - /dev/shm:/dev/shm

volumes:
  postgres_data:
