version: "3.8"

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: career_management
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    # Host portu publish ETME, sadece compose network içinde erişim
    ports:
      - "2121:5432" # CI için sabit, localde çakışmaz
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d career_management"]
      interval: 5s
      timeout: 5s
      ports:
        - "2121:5432" # CI için sabit, localde çakışmaz
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: ci
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/career_management
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: update

      # Selenium testlerin RemoteWebDriver ile bağlanması için
      SELENIUM_REMOTE_URL: http://selenium-hub:4444/wd/hub
    depends_on:
      postgres:
      - ./:/workspace
      - ./scripts:/workspace/scripts:ro
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8082:8080" # CI için sabit, localde çakışmaz
    # 8082 portundan host'a publish edildi

  maven:
    build:
      context: .
      dockerfile: docker/maven-with-docker/Dockerfile
    volumes:
      - ./:/workspace
      - ./scripts:/workspace/scripts:ro
      - /var/run/docker.sock:/var/run/docker.sock
    working_dir: /workspace
    environment:
      DB_HOST: postgres
      DB_USER: postgres
      DB_PASSWORD: postgres
      SELENIUM_REMOTE_URL: http://selenium-hub:4444/wd/hub
      APP_BASE_URL: http://app:8081
      # Prefer connecting to a local Docker-in-Docker daemon for Testcontainers on macOS
      DOCKER_HOST: tcp://docker-dind:2375
    depends_on:
      - app
      - docker-dind
    # Keep the container running idle so `docker compose up` doesn't execute `mvn` with no goals
    command: tail -f /dev/null
    # This service is used to run Maven commands inside the compose network so tests can reach other services.

  docker-dind:
    image: docker:24-dind
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: ""
    healthcheck:
      test: ["CMD-SHELL", "docker info >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12

  selenium-hub:
    image: selenium/hub:4.11.0
    platform: linux/amd64
    healthcheck:
      test: ["CMD-SHELL", "curl -sSf http://localhost:4444/status | grep -q '\"ready\":true' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12

  chrome:
    image: selenium/node-chrome:4.11.0
    platform: linux/amd64
    shm_size: 2gb
    depends_on:
      - selenium-hub
    environment:
      SE_EVENT_BUS_HOST: selenium-hub
      SE_EVENT_BUS_PUBLISH_PORT: 4442
      SE_EVENT_BUS_SUBSCRIBE_PORT: 4443
      SE_NODE_MAX_SESSIONS: 4
    volumes:
      - /dev/shm:/dev/shm

volumes:
  postgres_data:
